name: airtasker/spot/build-and-test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  test:
    name: test-node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true # if one job fails, stop the rest
      matrix:
        node-version: [18, 20, 22, 24]
        shard: ["1", "2", "3", "4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        uses: "./.github/actions/build-and-test"
        with:
          node_version: ${{ matrix.node-version }}
          shard: ${{ matrix.shard }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node-version }}-${{ matrix.shard }}
          path: ./test-reports

  test-summary-publish:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - name: Test summary
        uses: test-summary/action@v2.6
        with:
          paths: ./test-reports/**/*.xml

  lint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-repository

      - name: Run lint checker
        run: pnpm lint:check

  # Proves the image is a drop-in replacement for the npm package. Both are built from
  # this commit and must agree on generated output, exit codes and stdout. Nothing
  # else covers it: they resolve their dependencies independently, the image deletes
  # commands the package keeps, and the whole jest suite passes against an image that
  # cannot run at all.
  docker-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-repository

      - uses: docker/setup-buildx-action@v3

      # The node base image comes from Docker Hub, whose anonymous pull limit is keyed
      # on the runner's egress IP and shared with everything else on it. Conditional
      # because this repository is public: a pull request from a fork gets no secrets,
      # and an occasional rate-limit flake there is better than a gate forks cannot run.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single-arch into the local image store, because the parity script has to
          # run the image. Multi-arch cannot be loaded, so the step below builds it
          # without running it.
          load: true
          tags: spot:parity
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # arm64 is built under emulation, where a per-arch dependency or a QEMU quirk
      # can fail an install that amd64 resolved cleanly. Building it here is what
      # stops a release being the first time arm64 has ever been built. Covers the
      # build, not the behaviour.
      - name: Build the image for every published architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the CLI to compare against
        run: pnpm build

      - name: Compare the image against the CLI
        run: ./scripts/check-image-parity spot:parity

  # Rides the same GitHub Release event as the npm publish below, so a version means
  # the same thing on ghcr and on npm, and there is no second thing to remember.
  docker-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # Two releases published close together would otherwise race on which one ends up
    # as `latest`, `2` and `2.1`.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    needs:
      - test
      - lint-check
      - docker-parity
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Unconditional here, unlike in docker-parity: this job runs only on a release,
      # where the secret is always available. A skip could then only mean the secret has
      # been renamed or emptied, and skipping would turn that into an anonymous pull of
      # the base image across two platforms and three stages — a rate-limit failure
      # pointing nowhere near the missing secret.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # GITHUB_TOKEN, because the npm publish job below already pushes to GitHub
      # Packages with it.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/airtasker/spot
          # The release ref is the version tag, so these yield 2.1.0, 2.1 and 2. The
          # commit is recorded in the org.opencontainers.image.revision label that
          # metadata-action emits, so no separate sha tag is needed to trace an image
          # back to its source.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # A prerelease must not become what a consumer pulling `latest` gets.
          # `latest=auto` is metadata-action's default and applies `latest` only to
          # non-prereleases; it is named explicitly because copying `latest=true` from
          # a neighbouring repository would silently break that. Withholding
          # {{major}} and {{major}}.{{minor}} from prereleases is `type=semver`'s own
          # behaviour, not this block's.
          flavor: |
            latest=auto

      # arm64 is not optional: engineers run Spot on Apple Silicon, and bff-client's
      # devcontainer CI runner is arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - test
      - lint-check
      - docker-parity
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-repository

      - name: Authenticate with registries
        run: |
          cat > ~/.npmrc << 'EOF'
          //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          @airtasker:registry=https://npm.pkg.github.com
          EOF

      - name: Publish to NPM
        id: npm-publish
        run: pnpm publish --access=public --no-git-checks

      - name: Publish to GitHub Package Registry
        id: gpr-publish
        if: steps.npm-publish.outcome == 'success'
        run: pnpm publish --registry=https://npm.pkg.github.com --access=public --no-git-checks
        continue-on-error: true

      - name: Report publish status
        if: always()
        run: |
          if [ "${{ steps.npm-publish.outcome }}" != "success" ]; then
            echo "::error::NPM publish failed"
            exit 1
          fi

          if [ "${{ steps.gpr-publish.outcome }}" == "failure" ]; then
            echo "::warning::GitHub Package Registry publish failed, but NPM publish succeeded"
            echo "::warning::Manual GPR publish may be required"
          fi

          echo "✅ Package published to NPM: https://www.npmjs.com/package/@airtasker/spot"
