packages:
  - "docs"

overrides:
  jsonpath-plus: "^10.2"
  immer: "^9.0.6"

# Supply Chain Security Configuration
# Documentation: https://airtasker.atlassian.net/wiki/spaces/ENG/pages/4767645728/JavaScript+Package+Manager+Configuration
# Reference: https://pnpm.io/supply-chain-security

strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 10080
# A list, not a string: pnpm reads a scalar here as no exclusions and stops applying
# minimumReleaseAge at all, so the quarantine above silently covers nothing.
minimumReleaseAgeExclude:
  - "@airtasker/*"
allowBuilds:
  core-js: false
  # Reached through jest-resolve. Its postinstall only fetches a native binding when
  # the platform one is missing, and all 22 @unrs/resolver-binding-* are pinned in the
  # lockfile, so it resolves and exits. On a platform with no pinned binding the
  # failure moves to require time instead — denying the script does not self-heal that.
  unrs-resolver: false
  # Install-time analytics, reached through four of the seven @stoplight/spectral-*
  # packages in the tree.
  # Its postinstall reports the install to scarf.sh and it carries no functionality,
  # so it is never run.
  "@scarf/scarf": false

